<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ruman Hasan — Video Editor & Visual Storyteller</title>
  <meta name="description" content="Retention-first video editing for creators and brands. I turn raw footage into stories that hold attention." />

  <!-- Open Graph -->
  <meta property="og:title" content="Ruman Hasan — Video Editor & Visual Storyteller" />
  <meta property="og:description" content="Retention-first video editing for creators and brands. I turn raw footage into stories that hold attention." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rumanhasan.com" />
  <meta property="og:image" content="https://rumanhasan.com/og-image.jpg" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ruman Hasan — Video Editor & Visual Storyteller" />
  <meta name="twitter:description" content="Retention-first video editing for creators and brands. I turn raw footage into stories that hold attention." />
  <meta name="twitter:image" content="https://rumanhasan.com/og-image.jpg" />

  <!-- JSON-LD Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ruman Hasan",
    "jobTitle": "Video Editor",
    "url": "https://rumanhasan.com"
  }
  </script>

  <link rel="icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    :root {
      --bg: #F5F6F8;
      --ink: #17191F;
      --blue: #123CC4;
      --ice: #E8EEFF;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: 'Sora', 'Inter', sans-serif; }
    ::selection { background: var(--blue); color: #fff; }

    /* film grain */
    .grain::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .035;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .glow-card { transition: box-shadow .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1), border-color .5s; }
    .glow-card:hover {
      box-shadow: 0 0 0 1px rgba(18,60,196,.25), 0 24px 70px -18px rgba(18,60,196,.45), 0 0 50px -10px rgba(120,150,255,.55);
    }
    .tile-shadow { box-shadow: 0 30px 60px -25px rgba(18,60,196,.45), 0 10px 25px -12px rgba(23,25,31,.35), 0 0 0 1px rgba(255,255,255,.6); }

    .shimmer-text {
      background: linear-gradient(100deg, #123CC4 20%, #5B82FF 50%, #123CC4 80%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer { to { background-position: -200% center; } }
    @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity:.4; transform: scale(1.6);} }
    .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes scrollCue { 0% { transform: translateY(-100%);} 100% { transform: translateY(300%);} }
    .scroll-cue { animation: scrollCue 1.8s cubic-bezier(.6,0,.4,1) infinite; }
  </style>
</head>
<body class="grain">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const FM = window.Motion || window.FramerMotion;
    const { motion, AnimatePresence, useScroll, useTransform } = FM;

    /* ---------- DATA ---------- */
    const projects = [
      { id: 1, category: "Short-form", title: "Talking Head", aspect: "9:16", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793962295/Talking_Head_Final_Video_-_Composed.mp4" },
      { id: 2, category: "Short-form", title: "Talking Head", aspect: "9:16", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793944712/Talking-Head_Viral_Content_Ideas_Final.mp4" },
      { id: 3, category: "Short-form", title: "Talking Head", aspect: "9:16", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793944112/Talking-Head_Video_Editor_Recruitment_-_Final_Render.mp4" },
      { id: 4, category: "Short-form", title: "Talking Head", aspect: "9:16", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793942610/Talking_Head_-_Nvidia_Parakeet_TDT_Final_VIdeo.mp4" },
      { id: 5, category: "Long-form", title: "Prof Jiang", aspect: "16:9", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793946577/Short-Form_ProfJiang_-_Final_Video.mp4" },
      { id: 6, category: "Long-form", title: "Motion Ads", aspect: "16:9", video: "https://res.cloudinary.com/hrpvsqie/video/upload/f_auto,q_auto/v1793946121/BakiZero_-_Motion_Ads_English_Final_Video.mp4" }
    ];

    const poster = (url, w = 700, t = 1) =>
      url.replace("f_auto,q_auto", `so_${t},q_auto,w_${w}`).replace(/\.mp4$/, ".jpg");

    const faqs = [
      { q: "How long does a project take?", a: "Short-form: 2-3 days. Long-form: 6-7 days or more based on complexity." },
      { q: "What does your process look like?", a: "Understand requirements -> Research -> Draft -> Finalize. I keep you updated throughout." },
      { q: "How many revisions do you offer?", a: "2-3 rounds after the first draft." },
      { q: "What do you need to start?", a: "Raw footage, references, brief, and music preferences." },
      { q: "How does pricing work?", a: "Depends on type/duration. 50% advance, 50% on delivery." },
      { q: "How do we communicate?", a: "WhatsApp primarily, or Email/LinkedIn. I provide multiple updates daily." },
      { q: "What do I get at the end?", a: "Final 1080p video. 2K/4K available. Project files on request." }
    ];

    const ease = [0.22, 1, 0.36, 1];

    /* ---------- ICONS ---------- */
    const Icon = ({ d, className = "w-5 h-5", fill = "none", sw = 1.8 }) => (
      <svg viewBox="0 0 24 24" className={className} fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
      </svg>
    );
    const PlayI = (p) => <Icon {...p} fill="currentColor" sw={0} d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />;
    const PauseI = (p) => <Icon {...p} fill="currentColor" sw={0} d={["M7 5h3.5v14H7z", "M13.5 5H17v14h-3.5z"]} />;
    const VolI = (p) => <Icon {...p} d={["M11 5 6 9H3v6h3l5 4V5z", "M15.5 8.5a5 5 0 0 1 0 7", "M18.5 5.5a9 9 0 0 1 0 13"]} />;
    const MuteI = (p) => <Icon {...p} d={["M11 5 6 9H3v6h3l5 4V5z", "M22 9l-6 6", "M16 9l6 6"]} />;
    const ArrowI = (p) => <Icon {...p} d={["M5 12h14", "M13 6l6 6-6 6"]} />;
    const ArrowUR = (p) => <Icon {...p} d={["M7 17 17 7", "M8 7h9v9"]} />;

    /* ---------- NAV ---------- */
    function Nav() {
      const links = [["Work", "#work"], ["Process", "#process"], ["About", "#about"], ["FAQ", "#faq"]];
      return (
        <motion.header
          initial={{ y: -30, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ duration: 0.8, ease }}
          className="sticky top-1 sm:top-2 z-50 w-[calc(100%-2rem)] md:w-full max-w-6xl mx-auto bg-white/80 backdrop-blur-md border border-gray-200/60 rounded-full px-6 py-3.5 shadow-sm"
        >
          <div className="flex items-center justify-between">
            <a href="#top" className="font-display font-semibold tracking-tight text-[17px] flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-[#123CC4] shadow-[0_0_14px_3px_rgba(18,60,196,.55)]"></span>
              Ruman Hasan
            </a>
            <nav className="hidden md:flex items-center gap-8 text-sm text-[#17191F]/70">
              {links.map(([l, h]) => (
                <a key={l} href={h} className="hover:text-[#123CC4] transition-colors">{l}</a>
              ))}
            </nav>
            <a href="#contact" className="text-sm font-medium bg-[#17191F] text-white px-5 py-2.5 rounded-full hover:bg-[#123CC4] transition-colors duration-300">
              Let's talk
            </a>
          </div>
        </motion.header>
      );
    }

    /* ---------- HERO ---------- */
    const tiles = [
      { src: projects[0], t: 2, left: 34, top: 6, w: 28, ratio: "9/16", pull: [1, 13], rot: -2, z: 30, label: "Talking Head", tc: "00:00:18:12" },
      { src: projects[5], t: 3, left: 0, top: 14, w: 36, ratio: "16/9", pull: [22, 17], rot: -5, z: 20, label: "Motion Ads", tc: "00:01:04:02" },
      { src: projects[1], t: 2, left: 66, top: 0, w: 26, ratio: "9/16", pull: [-20, 17], rot: 4, z: 20, label: "Viral Ideas", tc: "00:00:09:21" },
      { src: projects[4], t: 4, left: 52, top: 62, w: 44, ratio: "16/9", pull: [-17, -17], rot: 3, z: 40, label: "Prof Jiang", tc: "00:02:41:08" },
      { src: projects[2], t: 3, left: 6, top: 48, w: 24, ratio: "9/16", pull: [22, -15], rot: -3, z: 25, label: "Recruitment", tc: "00:00:27:15" }
    ];

    function Tile({ cfg, idx, p }) {
      const x = useTransform(p, [0, 1], ["0%", `${cfg.pull[0]}%`]);
      const y = useTransform(p, [0, 1], ["0%", `${cfg.pull[1]}%`]);
      const s = useTransform(p, [0, 1], [1, 0.82]);
      const r = useTransform(p, [0, 1], [cfg.rot, cfg.rot * 0.3]);
      return (
        <motion.div style={{ x, y, scale: s }} className="absolute inset-0 pointer-events-none">
          <motion.div
            initial={{ opacity: 0, scale: 0.85, y: 40 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            transition={{ duration: 1, delay: 0.3 + idx * 0.12, ease }}
            style={{ rotate: r, left: cfg.left + "%", top: cfg.top + "%", width: cfg.w + "%", aspectRatio: cfg.ratio, zIndex: cfg.z }}
            className="absolute"
          >
            <motion.div
              animate={{ y: [0, idx % 2 ? 10 : -12, 0] }}
              transition={{ duration: 5 + idx * 0.8, repeat: Infinity, ease: "easeInOut" }}
              className="w-full h-full rounded-xl sm:rounded-2xl overflow-hidden tile-shadow bg-gradient-to-br from-[#E8EEFF] via-[#c9d6ff] to-[#123CC4] relative"
            >
              <img
                src={poster(cfg.src.video, 500, cfg.t)} alt={cfg.label} loading="eager"
                className="absolute inset-0 w-full h-full object-cover"
                onError={(e) => (e.currentTarget.style.display = "none")}
              />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0b1230]/70 via-transparent to-[#0b1230]/20" />
              <div className="absolute top-2 left-2 sm:top-3 sm:left-3 flex items-center gap-1.5 text-[8px] sm:text-[10px] font-medium tracking-widest text-white/90">
                <span className="w-1.5 h-1.5 rounded-full bg-red-500 pulse-dot"></span>REC
              </div>
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="w-8 h-8 sm:w-11 sm:h-11 rounded-full bg-white/20 backdrop-blur-md border border-white/40 flex items-center justify-center text-white">
                  <PlayI className="w-3 h-3 sm:w-4 sm:h-4 ml-0.5" />
                </span>
              </div>
              <div className="absolute bottom-0 inset-x-0 p-2 sm:p-3">
                <div className="flex justify-between items-end text-white">
                  <span className="text-[9px] sm:text-xs font-medium">{cfg.label}</span>
                  <span className="hidden sm:block text-[9px] font-mono opacity-70">{cfg.tc}</span>
                </div>
                <div className="mt-1.5 h-[2px] bg-white/25 rounded-full overflow-hidden">
                  <div className="h-full bg-white/90 rounded-full" style={{ width: 25 + idx * 14 + "%" }} />
                </div>
              </div>
            </motion.div>
          </motion.div>
        </motion.div>
      );
    }

    function Hero() {
      const range = useRef(800);
      useEffect(() => {
        const set = () => { range.current = window.innerHeight * (window.innerWidth >= 1024 ? 0.9 : 0.8); };
        set(); window.addEventListener("resize", set);
        return () => window.removeEventListener("resize", set);
      }, []);
      const { scrollY } = useScroll();
      const p = useTransform(scrollY, (v) => Math.min(Math.max(v / range.current, 0), 1));

      const textOpacity = useTransform(p, [0, 0.7], [1, 0.12]);
      const textY = useTransform(p, [0, 1], [0, -70]);
      const collageScale = useTransform(p, [0, 1], [1, 0.62]);
      const collageOpacity = useTransform(p, [0, 0.75, 1], [1, 1, 0.55]);
      const collageY = useTransform(p, [0, 1], [0, 20]);
      const glowScale = useTransform(p, [0, 1], [1, 1.8]);
      const glowOpacity = useTransform(p, [0, 1], [0.8, 0.3]);
      const cueOpacity = useTransform(p, [0, 0.15], [1, 0]);

      const stagger = (d) => ({ initial: { opacity: 0, y: 28 }, animate: { opacity: 1, y: 0 }, transition: { duration: 0.9, delay: d, ease } });

      return (
        <section id="top" className="relative lg:h-[190vh]">
          <div className="lg:sticky lg:top-0 lg:h-screen overflow-hidden">
            {/* ambient glows */}
            <motion.div style={{ scale: glowScale, opacity: glowOpacity }} className="absolute right-[-10%] top-[10%] w-[640px] h-[640px] rounded-full bg-[radial-gradient(circle,rgba(18,60,196,.22),rgba(232,238,255,.5)_45%,transparent_70%)] blur-3xl pointer-events-none" />
            <div className="absolute left-[-15%] bottom-[-10%] w-[480px] h-[480px] rounded-full bg-[radial-gradient(circle,rgba(232,238,255,.95),transparent_65%)] blur-2xl pointer-events-none" />
            <div className="absolute inset-0 opacity-[.35] pointer-events-none [background-image:linear-gradient(rgba(23,25,31,.05)_1px,transparent_1px),linear-gradient(90deg,rgba(23,25,31,.05)_1px,transparent_1px)] [background-size:64px_64px] [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]" />

            <div className="relative mx-auto max-w-6xl px-5 sm:px-6 pt-20 pb-14 lg:pt-16 lg:pb-0 lg:h-full grid lg:grid-cols-[1.02fr_1fr] gap-10 lg:gap-6 items-center">
              {/* Text */}
              <motion.div style={{ opacity: textOpacity, y: textY }}>
                <motion.div {...stagger(0.1)} className="inline-flex items-center gap-2.5 rounded-full bg-white/80 backdrop-blur border border-[#123CC4]/15 pl-2.5 pr-4 py-1.5 text-xs sm:text-[13px] font-medium shadow-[0_8px_30px_-12px_rgba(18,60,196,.4)]">
                  <span className="relative flex w-2 h-2">
                    <span className="absolute inset-0 rounded-full bg-[#123CC4] animate-ping opacity-60"></span>
                    <span className="relative w-2 h-2 rounded-full bg-[#123CC4]"></span>
                  </span>
                  Available for freelance projects
                </motion.div>

                <motion.h1 {...stagger(0.2)} className="font-display font-semibold tracking-[-0.03em] leading-[1.04] text-[2.45rem] sm:text-6xl lg:text-[3.45rem] xl:text-[4rem] mt-6">
                  I Turn Raw Footage Into <span className="shimmer-text">Stories That Hold Attention.</span>
                </motion.h1>

                <motion.p {...stagger(0.35)} className="mt-5 sm:mt-6 text-[15px] sm:text-lg text-[#17191F]/65 max-w-lg leading-relaxed">
                  Retention-first video editing for creators and brands — sharp pacing, clean storytelling and a cinematic finish, from scroll-stopping shorts to long-form narratives.
                </motion.p>

                <motion.div {...stagger(0.5)} className="mt-7 sm:mt-9 flex flex-wrap gap-3">
                  <a href="#work" className="group inline-flex items-center gap-2 bg-[#123CC4] text-white px-6 py-3.5 rounded-full text-sm sm:text-[15px] font-medium shadow-[0_14px_40px_-10px_rgba(18,60,196,.7)] hover:shadow-[0_18px_50px_-8px_rgba(18,60,196,.85)] hover:-translate-y-0.5 transition-all duration-300">
                    View My Work
                    <ArrowI className="w-4 h-4 transition-transform group-hover:translate-x-1" />
                  </a>
                  <a href="#contact" className="inline-flex items-center gap-2 bg-white/70 backdrop-blur border border-[#17191F]/12 px-6 py-3.5 rounded-full text-sm sm:text-[15px] font-medium hover:bg-[#E8EEFF] hover:border-[#123CC4]/30 hover:-translate-y-0.5 transition-all duration-300">
                    Let's Work Together
                  </a>
                </motion.div>

                <motion.div {...stagger(0.65)} className="mt-9 sm:mt-12 grid grid-cols-3 gap-4 max-w-md border-t border-[#17191F]/10 pt-5">
                  {[["2-3d", "Short-form turnaround"], ["2-3", "Revision rounds"], ["4K", "Delivery available"]].map(([n, l]) => (
                    <div key={l}>
                      <div className="font-display text-xl sm:text-2xl font-semibold text-[#123CC4]">{n}</div>
                      <div className="text-[11px] sm:text-xs text-[#17191F]/55 mt-0.5 leading-snug">{l}</div>
                    </div>
                  ))}
                </motion.div>
              </motion.div>

              {/* Collage */}
              <motion.div style={{ scale: collageScale, opacity: collageOpacity, y: collageY }} className="relative w-full max-w-[640px] mx-auto aspect-[10/9.6] will-change-transform">
                <div className="absolute inset-[10%] rounded-full bg-[#123CC4]/20 blur-3xl" />
                {tiles.map((cfg, i) => <Tile key={i} cfg={cfg} idx={i} p={p} />)}
              </motion.div>
            </div>

            <motion.div style={{ opacity: cueOpacity }} className="hidden lg:flex absolute bottom-7 left-1/2 -translate-x-1/2 flex-col items-center gap-2 text-[10px] tracking-[0.25em] uppercase text-[#17191F]/50">
              Scroll
              <span className="relative w-px h-9 bg-[#17191F]/15 overflow-hidden"><span className="scroll-cue absolute inset-x-0 top-0 h-1/3 bg-[#123CC4]"></span></span>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ---------- VIDEO CARD ---------- */
    function VideoCard({ project, index }) {
      const wrap = useRef(null);
      const vid = useRef(null);
      const bar = useRef(null);
      const [playing, setPlaying] = useState(false);
      const [muted, setMuted] = useState(true);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const v = vid.current;
        const io = new IntersectionObserver(
          ([e]) => {
            if (e.isIntersecting) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
            else v.pause();
          },
          { threshold: 0 }
        );
        io.observe(wrap.current);
        return () => io.disconnect();
      }, []);

      const toggle = (e) => {
        e && e.stopPropagation();
        const v = vid.current;
        if (v.paused) { const pr = v.play(); pr && pr.catch && pr.catch(() => {}); } else v.pause();
      };
      const seek = (e) => {
        e.stopPropagation();
        const v = vid.current; if (!v.duration) return;
        const r = e.currentTarget.getBoundingClientRect();
        v.currentTime = ((e.clientX - r.left) / r.width) * v.duration;
      };
      const onTime = () => {
        const v = vid.current;
        if (bar.current && v.duration) bar.current.style.width = (v.currentTime / v.duration) * 100 + "%";
      };

      return (
        <motion.article
          initial={{ opacity: 0, y: 40 }} whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-60px" }}
          transition={{ duration: 0.8, ease, delay: (index % 3) * 0.08 }}
          className="break-inside-avoid mb-8"
        >
          <div
            ref={wrap}
            onClick={toggle}
            style={{ aspectRatio: project.aspect.replace(":", "/") }}
            className="group relative rounded-[22px] sm:rounded-3xl overflow-hidden bg-[#E8EEFF] glow-card hover:-translate-y-1 cursor-pointer"
          >
            <video
              ref={vid}
              src={project.video}
              poster={poster(project.video, 800, 1)}
              muted={muted} loop playsInline preload="metadata"
              onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
              onTimeUpdate={onTime} onCanPlay={() => setReady(true)}
              className="absolute inset-0 w-full h-full object-cover"
            />
            {!ready && <div className="absolute inset-0 bg-gradient-to-br from-[#E8EEFF] to-[#cfdcff] animate-pulse -z-0 pointer-events-none opacity-40" />}
            <div className="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-black/55 to-transparent opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity duration-500 pointer-events-none" />

            {/* Controls */}
            <div className="absolute inset-x-0 bottom-0 px-3.5 pb-3.5 flex items-center gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-all duration-500 translate-y-0 md:translate-y-2 md:group-hover:translate-y-0">
              <button onClick={toggle} aria-label={playing ? "Pause" : "Play"} className="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white flex items-center justify-center hover:bg-white hover:text-[#123CC4] transition-colors">
                {playing ? <PauseI className="w-3.5 h-3.5" /> : <PlayI className="w-3.5 h-3.5 ml-0.5" />}
              </button>
              <button onClick={(e) => { e.stopPropagation(); setMuted((m) => !m); }} aria-label={muted ? "Unmute" : "Mute"} className="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white flex items-center justify-center hover:bg-white hover:text-[#123CC4] transition-colors">
                {muted ? <MuteI className="w-4 h-4" /> : <VolI className="w-4 h-4" />}
              </button>
            </div>

            {/* Progress */}
